# 调研大纲：DSH Tools 管理插件（tree 列出 + 全局启停）
# 生成日期：2026-08-xx（调研会话）
# 调研结论摘要：本插件所需的核心机制已在本会话中完成代码级确认，
#   outline 中的 items 服务于 deep 阶段的验证与补充，重点标注了实现方案与精度边界。

topic: DSH Tools 管理插件前期调研（tree 列出工具 + 全局启停）

items:
  - id: tool-runtime
    name: ctx.tools 运行时（ToolRuntime）
    desc: 工具注册表与执行管线。register（全局/agent 作用域）、schemas(scope) 投影、get、guard、restrict、presentAs、execute。
    status: 已调研（核心 API 已读源码确认）
    key_facts:
      - schemas() 仅返回 name/description/parameters，不含来源插件信息
      - register 返回 disposer，挂插件 fiber effect，卸载自动清理并触发 tools/change
      - restrict() 强制要求 scoped ctx，不能做全局过滤（关键限制）

  - id: tools-seams
    name: 工具执行缝（tools/* 事件）
    desc: tools/pre-execute（allow/deny/ask waterfall）、tools/execute（around-dispatch）、tools/post-execute（结果变换）、tools/result（只读观察）、tools/change（注册变更通知，unfiltered、无 payload）。
    status: 已调研
    key_facts:
      - tools/change 在 register/unregister/restriction 变化时触发，是归因 diff 的触发源
      - 全局 pre-execute 监听可 deny 任意 agent 的工具调用（scope-filtered dispatch，plain ctx 收到全部）

  - id: plugin-lifecycle
    name: Cordis 插件生命周期缝
    desc: internal/plugin（fiber 创建/销毁，fiber.name=插件显示名）、internal/status（fiber 状态迁移）、fiber.dispose 配对清理。
    status: 已调研（fiber.ts 源码确认）
    key_facts:
      - 工具来源归因方案：监听 internal/plugin 建立"当前加载插件"上下文 + tools/change 快照 diff 归因新增工具
      - 精度边界：同一插件多工具一次性 diff；插件加载窗口内并发归因偏移；插件运行期动态注册归因不可靠

  - id: prompt-assembly
    name: system-prompt 组装缝
    desc: system-prompt/assemble waterfall（可变换最终 PromptAssembly.tools）、systemPrompt.tools(provider)（多 provider schemas concat 合并，不能用于过滤）、toolOrder 排序。
    status: 已调研（assemble 源码确认）
    key_facts:
      - 全局隐藏方案：监听 system-prompt/assemble，过滤 assembly.tools 中 deny 列表后返回变换值
      - 多监听按序组合（官方测试确认）；scope 参数可区分 agent
      - 注意：此缝只影响模型可见 schema，不影响 run_code SDK 生成与执行路径，须与执行拒绝配合

  - id: approval-permission
    name: 审批/权限缝
    desc: ctx.approval（approval/request waterfall、ask/never 按会话策略）、permission-presets（workspace-write/danger-full-access 预设表）、approval/asked+decided 审计事件。
    status: 已调研（docs/subsystems/approval.md）
    key_facts:
      - tools/pre-execute 返回 ask 时经 ctx.approval 应答；approval 服务缺失时 ask 降级为 deny
      - 与"全局启停"正交：启停是 allow/deny 二值策略，审批是可选增强（对特定工具 ask）

  - id: scope-toolfilter
    name: 作用域链与子代理工具过滤
    desc: @deepseek-ai/dsh-scope（ScopeKey/scopeOf/scoped dispatch）、subagent toolFilter（子代理启动时 childCtx.tools.restrict()）。
    status: 已调研
    key_facts:
      - 子代理过滤是 restrict 的现成用法范本（tool-subagent 源码确认）
      - 备选"全局启停"实现：在 agent 缝（如 agent/session-start 或 agents 枚举）对每个 agent.ctx 应用 restrict({deny})，但需覆盖动态创建的子代理

  - id: session-events
    name: 持久化会话事件
    desc: tool/call、tool/result（工具调用与结果，durable）、approval/asked/decided/policy、permission/preset、sandbox/mode。
    status: 已调研（persistence-catalog）
    key_facts:
      - 审计/统计数据的持久化来源；tool/result 含 isError/耗时窗口
      - 启停状态本身的持久化走 ctx.settings（settings.yaml），不走会话事件

  - id: host-client
    name: Host↔Client 通信与 UI 挂载
    desc: ctx.webServer.register 前缀路由（host HTTP 端点）+ 浏览器 fetch；settings.plugin.item slot（设置页插件配置卡片）；ctx.settings.register 命名空间。
    status: 已调研（dsh-interpreters 源码范本）
    key_facts:
      - typertRemote SRC discovery 不 claim 插件服务端点（已确认的坑），必须用 webServer 前缀路由
      - 范本：dsh-interpreters /interpreters/api（get/set，JSON envelope）；DSH-better-sidebar 同模式
      - UI 备选挂载点：DSH-better-sidebar 三方 Tab 注册、chat composer dock（dsh-auto-blame 模式）

  - id: plugin-examples
    name: 现有插件范本
    desc: dsh-interpreters（工具+设置卡片+gateway）、dsh-sleep/dsh-mineru（纯工具注册）、DSH-better-sidebar（后台任务页工具调用轮询+三方 Tab 扩展）、dsh-auto-blame（composer dock 投影）。
    status: 已调研（README+源码）
    key_facts:
      - dsh-interpreters 是"配置型工具插件 + UI"的最完整范本（settings 注册 + webServer 路由 + slot 卡片）
      - 预构建 lib/ 入库策略是 client 插件的必选发布路径

  - id: release-standard
    name: 插件发布规范
    desc: bundle 形式（dsh.bundle.patch + cordis.patch.yml）、peerDependencies（cordis + @deepseek-ai/dsh-tools + dsh-system-prompt + dsh-settings + dsh-host-webserver + client 包）、测试分层（Unit + 真实组合 preflight + snapshot）、private 仓库发布。
    status: 已调研（plugin-development-guide.md）
    key_facts:
      - 零源码 patch 红线；patch 行 name 用包名；A6 不导出 default
      - 含 @deepseek-ai/* private peer 的 client 插件必须预构建 lib/ 入库

  - id: competitor-benchmark
    name: 竞品工具管理机制（最小调研）
    desc: OpenAI function calling 治理、Claude Agent SDK 工具权限、LangChain tool registry、MCP 工具治理。仅作设计参考，不做大规模调研。
    status: 待定（按用户要求从简，deep 阶段可选）

execution:
  batch_size: 3            # 并行 agent 数量（deep 阶段）
  items_per_agent: 3       # 每个 agent 调研 item 数
  output_dir: ./dsh-tools-manager/results
  focus: 实现可行性验证        # 本插件不追求竞品广度，deep 阶段重点验证关键机制边界
